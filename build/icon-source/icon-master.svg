<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <title>SanoVids</title>
  <!-- Master, used from 96 px up (and for the web / installer art).
       Plate: inset 16 (Windows 11 margin), radius 108 (22.5 %), the app's own orange (tokens accent-strong to accent),
       a soft rim (light top, faint warm shade at the bottom) that only shows at 256 / 512.
       Glyph, ink #1d1206 (token on-accent): the S-wire. Two elliptical bowls (90 x 62) joined by a straight 29 degree
       spine through the S centre (250, 262), stroke 54. The wire leaves the source dot (bottom left) and stops 14 short
       of the output disc (top right), like the ring around a connection dot on the canvas. The disc carries a rounded
       play cut-out, 45 % of its width, centroid 3 units right of centre for optical balance.
       Ink centroid = (256, 256). The glyph between the glyph markers is reused by make-icons.mjs for the
       full-bleed maskable / apple-touch icons: keep it a single <g> with no nested groups. -->
  <defs>
    <linearGradient id="sv-plate" x1="0" y1="16" x2="0" y2="496" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffb340"/>
      <stop offset="1" stop-color="#ff9f0a"/>
    </linearGradient>
    <linearGradient id="sv-rim" x1="0" y1="16" x2="0" y2="496" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity=".5"/>
      <stop offset=".3" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".75" stop-color="#7a3500" stop-opacity="0"/>
      <stop offset="1" stop-color="#7a3500" stop-opacity=".28"/>
    </linearGradient>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#sv-plate)"/>
  <rect x="17.5" y="17.5" width="477" height="477" rx="106.5" fill="none" stroke="url(#sv-rim)" stroke-width="3"/>
  <!-- glyph:start -->
  <g fill="#1d1206">
    <path d="M298 120H250A90 62 0 0 0 193.12 230.05L306.88 293.95A90 62 0 0 1 250 404H126" fill="none" stroke="#1d1206" stroke-width="54"/>
    <circle cx="126" cy="404" r="46"/>
    <path fill-rule="evenodd" d="M312 120a62 62 0 1 0 124 0a62 62 0 1 0-124 0Z
      M358.33 101.52A8 8 0 0 1 370.33 94.6L402.33 113.07A8 8 0 0 1 402.33 126.93L370.33 145.4A8 8 0 0 1 358.33 138.48Z"/>
  </g>
  <!-- glyph:end -->
</svg>
