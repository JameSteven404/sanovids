<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
  <title>SanoVids</title>
  <!-- The glyph alone, one colour (currentColor), for in-app use: same 24-unit grid as icon-24.svg, so inside the
       24 px orange .tb-logo tile it is pixel-identical to the taskbar icon. The plug gap is a real gap (the wire simply
       stops before the disc), so the mark also works bare: orange on the dark UI, ink on light. -->
  <path d="M14 4.5H12A4.5 3.3 0 0 0 9.22 10.39L14.78 13.61A4.5 3.3 0 0 1 12 19.5H6" fill="none" stroke="currentColor" stroke-width="3"/>
  <circle cx="18" cy="4.5" r="3"/>
  <circle cx="6" cy="19.5" r="3"/>
</svg>
