<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <title>SanoVids</title>
  <!-- 24 px cut (1 unit = 1 px): the Windows 11 taskbar size and the in-app top-bar logo.
       Stroke 3; strokes y 3-6 / 18-21 and bowl sides x 6-9 / 15-18 sit on whole pixels.
       Plug gap = the clean pixel column x 14. -->
  <defs>
    <linearGradient id="sv-plate-24" x1="0" y1="0" x2="0" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffb340"/>
      <stop offset="1" stop-color="#ff9f0a"/>
    </linearGradient>
  </defs>
  <rect width="24" height="24" rx="5.25" fill="url(#sv-plate-24)"/>
  <g fill="#1d1206">
    <path d="M14 4.5H12A4.5 3.3 0 0 0 9.22 10.39L14.78 13.61A4.5 3.3 0 0 1 12 19.5H6" fill="none" stroke="#1d1206" stroke-width="3"/>
    <circle cx="18" cy="4.5" r="3"/>
    <circle cx="6" cy="19.5" r="3"/>
  </g>
</svg>
