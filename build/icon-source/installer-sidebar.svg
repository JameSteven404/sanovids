<svg xmlns="http://www.w3.org/2000/svg" width="164" height="314" viewBox="0 0 164 314">
  <!-- NSIS welcome / finish sidebar, 164 x 314. make-icons.mjs renders it to build/installerSidebar.bmp and
       build/uninstallerSidebar.bmp (24-bit, no alpha). href="icon:64" is replaced at build time by the 64 px app icon
       rendered from its pixel-hinted cut. Text uses Segoe UI (loaded from C:/Windows/Fonts by the generator). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="314" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1e1e20"/>
      <stop offset="1" stop-color="#161618"/>
    </linearGradient>
    <radialGradient id="glow" cx="82" cy="112" r="78" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff9f0a" stop-opacity=".2"/>
      <stop offset="1" stop-color="#ff9f0a" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="12" height="12" patternUnits="userSpaceOnUse">
      <rect x="5.5" y="5.5" width="1" height="1" fill="#fff" fill-opacity=".07"/>
    </pattern>
  </defs>
  <rect width="164" height="314" fill="url(#bg)"/>
  <rect width="164" height="314" fill="url(#grid)"/>
  <circle cx="82" cy="112" r="78" fill="url(#glow)"/>

  <!-- canvas wires: a reference image (teal) goes in, a video (purple) comes out -->
  <g fill="none" stroke-width="2" stroke-linecap="round" opacity=".55">
    <path d="M-4 70C22 70 26 112 44 112" stroke="#40c8e0"/>
    <path d="M120 112C138 112 142 154 168 154" stroke="#bf5af2"/>
  </g>
  <circle cx="44" cy="112" r="3.5" fill="#40c8e0" stroke="#1e1e20" stroke-width="2"/>
  <circle cx="120" cy="112" r="3.5" fill="#bf5af2" stroke="#1e1e20" stroke-width="2"/>

  <image x="50" y="80" width="64" height="64" href="icon:64"/>

  <text x="82" y="182" text-anchor="middle" font-family="Segoe UI" font-weight="600" font-size="22" fill="#f5f5f7">SanoVids</text>
  <text x="82" y="201" text-anchor="middle" font-family="Segoe UI" font-size="11" fill="#a1a1a6">Dựng phim AI theo từng cảnh</text>

  <rect x="66" y="268" width="32" height="1" fill="#fff" fill-opacity=".12"/>
  <text x="82" y="288" text-anchor="middle" font-family="Segoe UI" font-size="10.5" fill="#8e8e93">Nguyễn Giang Minh</text>
  <text x="82" y="302" text-anchor="middle" font-family="Segoe UI" font-size="10.5" fill="#8e8e93">(Jame Steven)</text>
</svg>
